packages:
    - 'bot'
    - 'web'

overrides:
    '@tiptap/core': '3.30.5'
    '@tiptap/pm': '3.30.5'
    'brace-expansion@>=4.0.0 <5.0.9': '5.0.12'
    devalue: '5.9.2'
    'esbuild@>=0.27.3 <0.28.1': '0.28.1'
    nitropack: '2.13.4'
    postcss: '8.5.23'
    'undici@>=6.0.0 <6.28.1': '6.28.1'
    'undici@>=7.0.0 <7.29.1': '7.29.1'
    'undici@>=8.0.0 <8.10.2': '8.10.2'

minimumReleaseAgeExclude:
    - '@nuxt/image@2.1.0'
    - 'ipx@4.0.0-beta.1'
    - brace-expansion@5.0.12
    - js-yaml@4.3.2
    - nanoid@3.3.19
    - sharp@0.35.5
    - '@tiptap/core@3.30.5'
    - svgo@4.1.0

allowBuilds:
    '@parcel/watcher': true
    esbuild: true
    sharp: true
    unrs-resolver: true
    vue-demi: true
