name: CI

on:
    workflow_dispatch:
    push:
        branches: [master]
    pull_request:
        branches: [master]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    lint-format:
        runs-on: ubuntu-latest
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
              with:
                  # TODO: switch to block once egress endpoints are catalogued
                  egress-policy: audit

            - name: Check out code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  persist-credentials: false

            - name: Set up workspace
              uses: ./.github/actions/setup-pnpm

            - name: Audit dependencies
              run: pnpm audit --audit-level=high

            - name: Run ESLint
              run: pnpm run lint

            - name: Run Prettier
              run: pnpm run prettier

    bot-test:
        needs: lint-format
        runs-on: ubuntu-latest
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
              with:
                  # TODO: switch to block once egress endpoints are catalogued
                  egress-policy: audit

            - name: Check out code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  persist-credentials: false

            - name: Set up bot workspace
              uses: ./.github/actions/setup-pnpm
              with:
                  filter: powercord-bot

            - name: Type-check bot
              run: pnpm run typecheck:bot

            - name: Run bot tests with coverage
              run: pnpm run test:bot:coverage

            - name: Upload bot coverage
              uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./bot/coverage/lcov.info
                  flags: bot

    web-test:
        needs: lint-format
        runs-on: ubuntu-latest
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
              with:
                  # TODO: switch to block once egress endpoints are catalogued
                  egress-policy: audit

            - name: Check out code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  persist-credentials: false

            - name: Set up web workspace
              uses: ./.github/actions/setup-pnpm
              with:
                  filter: powercord-web

            - name: Type-check web
              run: pnpm run typecheck:web

            - name: Install browser for web tests
              run: pnpm --filter powercord-web exec playwright install --with-deps chromium

            - name: Run web tests with coverage
              run: pnpm run test:web:coverage

            - name: Upload web coverage
              uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./web/coverage/lcov.info
                  flags: web

    docker:
        uses: ./.github/workflows/docker-validate.yml

    security:
        permissions:
            contents: read
            security-events: write
        uses: ./.github/workflows/security.yml

    ci-pass:
        if: always()
        needs: [lint-format, bot-test, web-test, docker, security]
        runs-on: ubuntu-latest
        steps:
            - name: Require every check to pass
              env:
                  RESULTS: ${{ join(needs.*.result, ',') }}
              run: test "$RESULTS" = 'success,success,success,success,success'
