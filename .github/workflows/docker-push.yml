name: Docker Push

on:
    workflow_dispatch:
    push:
        branches: [master]
        paths:
            - 'bot/**'
            - '.dockerignore'
            - 'package.json'
            - 'pnpm-workspace.yaml'
            - 'pnpm-lock.yaml'
            - '.github/workflows/docker-push.yml'
            - '.github/actions/**'

permissions:
    contents: read

concurrency:
    group: docker-push-${{ github.ref }}
    cancel-in-progress: true

jobs:
    docker-push:
        runs-on: ubuntu-latest
        env:
            ECR_REPOSITORY: powercord-bot
        permissions:
            id-token: write
            contents: read
            security-events: write
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
              with:
                  # TODO: switch to block once egress endpoints are catalogued
                  egress-policy: audit

            - name: Check out code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  persist-credentials: false

            - name: Set up QEMU
              uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

            - name: Resolve build versions
              id: versions
              uses: ./.github/actions/resolve-versions

            - name: Build Docker image
              uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
              with:
                  context: .
                  file: bot/Dockerfile
                  platforms: linux/arm64
                  pull: true
                  load: true
                  tags: powercord-bot:${{ github.sha }}
                  build-args: |
                      PNPM_VERSION=${{ steps.versions.outputs.pnpm }}
                  cache-from: type=gha,scope=powercord-bot-arm64
                  cache-to: type=gha,mode=max,scope=powercord-bot-arm64,ignore-error=true

            - name: Run Trivy image scan
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  image-ref: powercord-bot:${{ github.sha }}
                  vuln-type: os,library
                  severity: HIGH,CRITICAL
                  ignore-unfixed: true
                  format: sarif
                  output: trivy-image.sarif
                  exit-code: '1'
                  version: v0.70.0

            - name: Upload Trivy image SARIF
              if: ${{ always() && hashFiles('trivy-image.sarif') != '' }}
              uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
              with:
                  sarif_file: trivy-image.sarif
                  category: trivy-image

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: us-east-1

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419 # v2

            - name: Push Docker image
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
              run: |
                  docker tag "powercord-bot:${{ github.sha }}" "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
                  docker tag "powercord-bot:${{ github.sha }}" "${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ github.sha }}"
                  docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
                  docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ github.sha }}"

            - name: Restart bot on EC2
              run: |
                  INSTANCE_ID=$(aws ec2 describe-instances \
                    --filters "Name=tag:Name,Values=powercord-bot" \
                              "Name=instance-state-name,Values=running" \
                    --region us-east-1 \
                    --query "sort_by(Reservations[].Instances[], &LaunchTime)[-1].InstanceId" \
                    --output text)
                  if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
                    echo "No running powercord-bot instance found. Deploy PowercordBotStack first." >&2
                    exit 1
                  fi

                  echo "Waiting for ${INSTANCE_ID} to become available in SSM..."
                  SSM_READY=
                  for attempt in {1..60}; do
                    SSM_READY=$(aws ssm describe-instance-information \
                      --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
                      --region us-east-1 \
                      --query "InstanceInformationList[?PingStatus=='Online'].InstanceId | [0]" \
                      --output text)
                    if [ "$SSM_READY" = "$INSTANCE_ID" ]; then
                      break
                    fi
                    echo "SSM not ready yet (${attempt}/60); retrying..."
                    sleep 10
                  done
                  if [ "$SSM_READY" != "$INSTANCE_ID" ]; then
                    echo "Instance ${INSTANCE_ID} did not become SSM Online in time" >&2
                    exit 1
                  fi

                  echo "Waiting for UserData (cloud-init) to complete on ${INSTANCE_ID}..."
                  INIT_CMD_ID=$(aws ssm send-command \
                    --instance-ids "$INSTANCE_ID" \
                    --document-name "AWS-RunShellScript" \
                    --parameters '{"commands":["cloud-init status --wait"]}' \
                    --region us-east-1 \
                    --query "Command.CommandId" \
                    --output text)

                  for attempt in {1..60}; do
                    INIT_STATUS=$(aws ssm get-command-invocation \
                      --command-id "$INIT_CMD_ID" \
                      --instance-id "$INSTANCE_ID" \
                      --region us-east-1 \
                      --query "Status" \
                      --output text 2>/dev/null || true)
                    case "$INIT_STATUS" in
                      Success)
                        echo "UserData complete"
                        break
                        ;;
                      Failed|Cancelled|TimedOut|Cancelling)
                        echo "cloud-init wait failed with status: ${INIT_STATUS}" >&2
                        exit 1
                        ;;
                    esac
                    echo "cloud-init status: ${INIT_STATUS:-Pending} (${attempt}/60)"
                    sleep 5
                  done

                  COMMAND_ID=$(aws ssm send-command \
                    --instance-ids "$INSTANCE_ID" \
                    --document-name "AWS-RunShellScript" \
                    --parameters '{"commands":["/opt/powercord-start.sh ${{ github.sha }}"]}' \
                    --region us-east-1 \
                    --query "Command.CommandId" \
                    --output text)

                  for attempt in {1..60}; do
                    STATUS=$(aws ssm get-command-invocation \
                      --command-id "$COMMAND_ID" \
                      --instance-id "$INSTANCE_ID" \
                      --region us-east-1 \
                      --query "Status" \
                      --output text 2>/dev/null || true)
                    case "$STATUS" in
                      Success)
                        echo "Bot restart command succeeded"
                        exit 0
                        ;;
                      Failed|Cancelled|TimedOut|Cancelling)
                        echo "Bot restart command failed with status: ${STATUS}" >&2
                        aws ssm get-command-invocation \
                          --command-id "$COMMAND_ID" \
                          --instance-id "$INSTANCE_ID" \
                          --region us-east-1 \
                          --query "{stdout:StandardOutputContent,stderr:StandardErrorContent}" \
                          --output text >&2 || true
                        exit 1
                        ;;
                    esac
                    echo "Bot restart command status: ${STATUS:-Pending} (${attempt}/60)"
                    sleep 5
                  done

                  echo "Timed out waiting for bot restart command ${COMMAND_ID}" >&2
                  exit 1
