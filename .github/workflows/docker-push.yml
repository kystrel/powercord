name: 'Docker Push'

on:
    workflow_dispatch:
    push:
        branches: [master]
        paths:
            - 'bot/**'
            - '.dockerignore'
            - 'package.json'
            - 'pnpm-workspace.yaml'
            - 'pnpm-lock.yaml'
            - '.github/workflows/docker-push.yml'

jobs:
    docker-push:
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: us-east-1

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build, tag, and push Docker image
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  ECR_REPOSITORY: 'powercord-bot'
              run: |
                  PNPM_VERSION=$(jq -r '.packageManager | ltrimstr("pnpm@")' package.json)
                  docker build --build-arg PNPM_VERSION="$PNPM_VERSION" -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} -f bot/Dockerfile .
                  docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
                  docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

            - name: Update ECS service
              run: |
                  aws ecs update-service \
                    --cluster powercord-bot-cluster \
                    --service powercord-bot-service \
                    --force-new-deployment
