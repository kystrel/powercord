name: 'Docker Validate'

on:
    workflow_dispatch:
    pull_request:
        branches: [master]
        paths:
            - 'bot/**'
            - '.dockerignore'
            - 'package.json'
            - 'pnpm-workspace.yaml'
            - 'pnpm-lock.yaml'
            - '.github/workflows/docker-push.yml'
            - '.github/workflows/docker-validate.yml'

permissions:
    contents: read
    security-events: write

concurrency:
    group: docker-validate-${{ github.ref }}
    cancel-in-progress: true

jobs:
    docker-validate:
        runs-on: ubuntu-latest
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
              with:
                  egress-policy: audit

            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Lint Dockerfile
              uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
              with:
                  dockerfile: ./bot/Dockerfile

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

            - name: Resolve build versions
              id: versions
              shell: bash
              run: |
                  pnpm_version="$(jq -r '.packageManager | split("@")[1]' package.json)"
                  if [[ -z "${pnpm_version}" || "${pnpm_version}" == "null" ]]; then
                      echo "Unable to resolve pnpm version from package.json" >&2
                      exit 1
                  fi
                  echo "pnpm=${pnpm_version}" >> "${GITHUB_OUTPUT}"

            - name: Build Docker image
              uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
              with:
                  context: .
                  file: bot/Dockerfile
                  pull: true
                  load: true
                  tags: powercord-bot-validate:${{ github.sha }}
                  build-args: |
                      PNPM_VERSION=${{ steps.versions.outputs.pnpm }}
                  cache-from: type=gha,scope=powercord-bot
                  cache-to: type=gha,mode=max,scope=powercord-bot,ignore-error=true

            - name: Run Trivy image scan
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  image-ref: powercord-bot-validate:${{ github.sha }}
                  vuln-type: os,library
                  severity: HIGH,CRITICAL
                  ignore-unfixed: true
                  format: sarif
                  output: trivy-image.sarif
                  exit-code: '1'
                  version: v0.70.0

            - name: Upload Trivy image SARIF
              if: ${{ always() && hashFiles('trivy-image.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
              uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
              with:
                  sarif_file: trivy-image.sarif
                  category: trivy-image

            - name: Run Docker container
              env:
                  IMAGE_TAG: powercord-bot-validate:${{ github.sha }}
              run: |
                  docker run -d --name bot-validate -p 3000:3000 "${IMAGE_TAG}"
                  echo "Waiting for health endpoint..."
                  for attempt in {1..30}; do
                    echo "Health check attempt ${attempt}/30"
                    if curl -sf http://localhost:3000/health > /dev/null; then
                      echo "Health check passed"
                      break
                    fi
                    sleep 2
                  done
                  if ! curl -sf http://localhost:3000/health > /dev/null; then
                    echo "Container did not become healthy in time" >&2
                    docker logs --tail 200 bot-validate || true
                    exit 1
                  fi
                  docker stop bot-validate

            - name: Show logs on fail
              if: failure()
              run: docker logs --tail 200 bot-validate || true

            - name: Clean up
              if: always()
              run: docker rm -f bot-validate || true
